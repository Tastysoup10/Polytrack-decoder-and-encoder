name: Build PolyTrack

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm Polytrack_singlefile.spec

      - name: Rename artifact
        shell: pwsh
        run: Move-Item dist/Polytrack.exe dist/Polytrack-Windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polytrack-Windows-x64
          path: dist/Polytrack-Windows-x64.exe

  build-macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm Polytrack_macos.spec

      - name: Package
        run: |
          cd dist
          zip -r ../Polytrack-macOS-Intel.zip Polytrack.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polytrack-macOS-Intel
          path: Polytrack-macOS-Intel.zip

  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm Polytrack_macos.spec

      - name: Package
        run: |
          cd dist
          zip -r ../Polytrack-macOS-Apple-Silicon.zip Polytrack.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polytrack-macOS-Apple-Silicon
          path: Polytrack-macOS-Apple-Silicon.zip

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm Polytrack_linux.spec

      - name: Package
        run: |
          tar -czf Polytrack-Linux-x64.tar.gz -C dist Polytrack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polytrack-Linux-x64
          path: Polytrack-Linux-x64.tar.gz

  release:
    name: Attach builds to GitHub Release
    needs:
      - build-windows
      - build-macos-intel
      - build-macos-arm64
      - build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Polytrack-Windows-x64/Polytrack-Windows-x64.exe
            artifacts/Polytrack-macOS-Intel/Polytrack-macOS-Intel.zip
            artifacts/Polytrack-macOS-Apple-Silicon/Polytrack-macOS-Apple-Silicon.zip
            artifacts/Polytrack-Linux-x64/Polytrack-Linux-x64.tar.gz
